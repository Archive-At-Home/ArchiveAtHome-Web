<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archive-At-Home - 让归档更简单</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-full max-w-7xl h-[600px] pointer-events-none overflow-hidden opacity-30 z-0">
        <div class="absolute -top-40 left-1/4 w-[500px] h-[500px] bg-indigo-500 rounded-full blur-[120px]"></div>
        <div class="absolute -top-20 right-1/4 w-[400px] h-[400px] bg-emerald-500 rounded-full blur-[100px]"></div>
    </div>

    <header class="relative z-10 max-w-7xl w-full mx-auto px-6 py-6 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600 p-2 rounded-xl shadow-lg shadow-indigo-600/30">
                <i data-lucide="archive" class="w-6 h-6 text-white"></i>
            </div>
            <span class="text-xl font-bold tracking-tight bg-gradient-to-r report from-white to-slate-400 bg-clip-text text-transparent">Archive-At-Home</span>
        </div>
        <div class="hidden md:flex space-x-6 text-sm font-medium text-slate-400">
            <a href="#" class="hover:text-white transition">特性</a>
            <a href="#" class="hover:text-white transition">关于项目</a>
        </div>
    </header>

    <main class="relative z-10 max-w-4xl mx-auto px-6 text-center py-20 md:py-32 flex-grow flex flex-col justify-center items-center">
        
        <div class="inline-flex items-center space-x-2 bg-slate-800/80 border border-slate-700/50 px-4 py-1.5 rounded-full text-xs font-medium text-indigo-400 mb-6 backdrop-blur-sm">
            <span class="flex h-2 w-2 rounded-full bg-emerald-400 animate-pulse"></span>
            <span>EHentai公益归档</span>
        </div>

        <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight mb-6 bg-gradient-to-b from-white to-slate-300 bg-clip-text text-transparent">
            Archive-At-Home
        </h1>
        <p class="text-xl md:text-2xl font-medium text-indigo-400 mb-4 tracking-wide">
            让归档更简单
        </p>
        <p class="text-base md:text-lg text-slate-400 max-w-2xl mb-12 leading-relaxed">
            共享您无处使用的归档配额，将其免费提供给更多想要体验极速和完整归档下载的海量用户
        </p>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 w-full max-w-3xl px-4">
            
            <a href="https://docs.archive-at-home.org/" target="_blank" rel="noopener noreferrer" 
               class="group flex items-center justify-center space-x-3 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-4 px-6 rounded-2xl shadow-xl shadow-indigo-600/20 hover:shadow-indigo-500/30 transition-all duration-200 transform hover:-translate-y-0.5">
                <i data-lucide="book-open" class="w-5 h-5 transition-transform group-hover:scale-110"></i>
                <span>文档站</span>
                <i data-lucide="arrow-right" class="w-4 h-4 opacity-0 -translate-x-2 group-hover:opacity-100 group-hover:translate-x-0 transition-all duration-200"></i>
            </a>

            <a href="https://your-tools-url.com" target="_blank" rel="noopener noreferrer" 
               class="group flex items-center justify-center space-x-3 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-semibold py-4 px-6 rounded-2xl hover:text-white transition-all duration-200 transform hover:-translate-y-0.5 backdrop-blur-sm">
                <i data-lucide="wrench" class="w-5 h-5 text-indigo-400 transition-transform group-hover:rotate-12"></i>
                <span>小工具</span>
            </a>

            <a href="https://t.me/ArchiveAtHome" target="_blank" rel="noopener noreferrer" 
               class="group flex items-center justify-center space-x-3 bg-sky-600/10 hover:bg-sky-600 border border-sky-500/30 hover:border-sky-500 text-sky-400 hover:text-white font-semibold py-4 px-6 rounded-2xl transition-all duration-200 transform hover:-translate-y-0.5 backdrop-blur-sm">
                <i data-lucide="send" class="w-5 h-5 transition-transform group-hover:translate-x-0.5 group-hover:-translate-y-0.5"></i>
                <span>Telegram 频道</span>
            </a>
            
        </div>
    </main>

    <footer class="relative z-10 border-t border-slate-800/60 bg-slate-900/50 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-6 py-6 flex flex-col sm:flex-row justify-between items-center text-sm text-slate-500">
            <p>© 2026 Archive-At-Home. Open Source Project.</p>
            <p class="mt-2 sm:mt-0 flex items-center">
                Made with <i data-lucide="heart" class="w-4 h-4 text-rose-500 mx-1 fill-rose-500"></i> for simpler archiving.
            </p>
        </div>
    </footer>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
